<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Flash Chatbot - Neon Edition</title>
    <style>
        /* ===== GLOBAL STYLING ===== */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: cover;
            color: #fff;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar h2 {
            color: #00eaff;
            margin-top: 0;
        }

        .menu-item {
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
        }

        .menu-item:hover {
            background: #00eaff;
            color: #111;
            transform: translateX(5px);
        }

        /* ===== MAIN AREA ===== */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 22px;
            color: #00eaff;
            backdrop-filter: blur(10px);
            text-shadow: 0 0 10px #00eaff;
        }

        /* ===== CHAT CONTAINER ===== */
        .chat-container {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(0, 234, 255, 0.2);
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* ===== MESSAGE BUBBLES ===== */
        .message { display: flex; margin-bottom: 15px; }
        .user-message { justify-content: flex-end; }
        .bot-message { justify-content: flex-start; }

        .user-bubble {
            background: linear-gradient(135deg, #00eaff, #00b7ff);
            padding: 12px 16px;
            color: #111;
            border-radius: 15px 15px 0 15px;
            max-width: 70%;
            box-shadow: 0 0 10px #00eaff;
        }

        .bot-bubble {
            background: rgba(255,255,255,0.2);
            padding: 12px 16px;
            border-radius: 15px 15px 15px 0;
            max-width: 70%;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25);
        }

        .input-area input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: #fff;
        }

        .input-area button {
            margin-left: 10px;
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            background: #00eaff;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .input-area button:hover {
            background: #00bcd4;
            transform: scale(1.05);
        }

        /* ===== WIDGET PANEL ===== */
        .widget-panel {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .widget-btn {
            background: #6c5ce7;
            padding: 10px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            flex: 1;
            text-align: center;
            margin: 5px;
            transition: 0.25s;
        }

        .widget-btn:hover {
            background: #a29bfe;
            transform: scale(1.05);
        }

        .widget-row { display: flex; }

    </style>
</head>
<body>

    <div class="sidebar">
        <h2>⚡ Navigation</h2>
        <div class="menu-item" onclick="newChat()">➕ New Chat</div>
        <div class="menu-item" onclick="insertFAQ()">📘 FAQ</div>
        <div class="menu-item" onclick="toggleWidgets()">🎛 Widgets</div>
        <div class="menu-item" onclick="toggleTheme()">🌙 Theme</div>
    </div>

    <div class="main">
        <div class="header">🌐 Gemini Neon Chat Assistant</div>

        <div id="widget-panel" class="widget-panel" style="display:none;">
            <div class="widget-row">
                <div class="widget-btn" onclick="sendPreset('Tell me a joke')">😂 Joke</div>
                <div class="widget-btn" onclick="sendPreset('Give me a tech fact')">💡 Tech Fact</div>
                <div class="widget-btn" onclick="sendPreset('Explain AI in simple terms')">🤖 Explain AI</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-box" id="chat-box">
                <div class="message bot-message">
                    <div class="bot-bubble">✨ Hello! I'm your neon-themed AI assistant. Ask me anything!</div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

    function displayMessage(message, sender) {
        const row = document.createElement('div');
        row.className = `message ${sender}-message`;
        const bubble = document.createElement('div');
        bubble.className = `${sender}-bubble`;
        bubble.textContent = message;

        row.appendChild(bubble);
        chatBox.appendChild(row);
        scrollToBottom();
    }

    function sendMessage() {
        const msg = userInput.value.trim();
        if (!msg) return;

        displayMessage(msg, 'user');
        userInput.value = '';

        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        })
        .then(res => res.json())
        .then(data => displayMessage(data.response, 'bot'))
        .catch(() => displayMessage('⚠ Server error. Try again later.', 'bot'));
    }

    function sendPreset(text) {
        userInput.value = text;
        sendMessage();
    }

    function toggleWidgets() {
        const panel = document.getElementById('widget-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function newChat() {
        chatBox.innerHTML = '';
        displayMessage('✨ New chat started!', 'bot');
    }

    function insertFAQ() {
        displayMessage('📘 FAQ:\n1. What can you do?\n2. How to use widgets?\n3. Can you explain technical topics?', 'bot');
    }

</script>

</body>
</html>
